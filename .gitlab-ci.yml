stages:
  - validate
  - build

workflow:
  rules:
    # Run on all merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on direct pushes to main
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  GOPROXY: "https://proxy.golang.org,direct"

.go-template: &go-template
  image: golang:1.22
  before_script:
    - go mod download

lint:
  <<: *go-template
  stage: validate
  script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - make lint

test:
  <<: *go-template
  stage: validate
  script:
    - make test

build:
  <<: *go-template
  stage: build
  script:
    - make build
  artifacts:
    paths:
      - bin/
    expire_in: 1 week